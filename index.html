<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>詩歌檢索庫 | Hymn Library</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- 載入 Mozilla PDF.js 預覽器 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    :root {
      --bg-color: #f5f5f7;
      --card-bg: rgba(255, 255, 255, 0.78);
      --card-border: rgba(255, 255, 255, 0.9);
      --accent-color: #0071e3;
      --accent-hover: #0077ed;
      --secondary-btn-bg: #e8e8ed;
      --secondary-btn-hover: #dcdce0;
      --text-main: #1d1d1f;
      --text-secondary: #86868b;
      --shadow-soft: 0 8px 30px rgba(0, 0, 0, 0.04);
      --shadow-modal: 0 20px 40px rgba(0, 0, 0, 0.15);
      --pill-bg: rgba(255, 255, 255, 0.8);
      --pill-border: rgba(0, 0, 0, 0.08);
      --pill-text: #424245;
      --pill-active-bg: #0071e3;
      --pill-active-text: #ffffff;
      --stats-bg: rgba(0, 0, 0, 0.03);
      --modal-bg: rgba(255, 255, 255, 0.92);
      --radius-lg: 20px;
      --radius-md: 12px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #000000;
        --card-bg: rgba(28, 28, 30, 0.75);
        --card-border: rgba(255, 255, 255, 0.12);
        --accent-color: #0a84ff;
        --accent-hover: #409cff;
        --secondary-btn-bg: #2c2c2e;
        --secondary-btn-hover: #3a3a3c;
        --text-main: #f5f5f7;
        --text-secondary: #98989d;
        --shadow-soft: 0 8px 30px rgba(0, 0, 0, 0.3);
        --pill-bg: rgba(44, 44, 46, 0.8);
        --pill-border: rgba(255, 255, 255, 0.15);
        --pill-text: #d1d1d6;
        --pill-active-bg: #0a84ff;
        --pill-active-text: #ffffff;
        --stats-bg: rgba(255, 255, 255, 0.06);
        --modal-bg: rgba(30, 30, 32, 0.92);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 30px 16px 80px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .container { width: 100%; max-width: 860px; }

    header { text-align: center; margin-bottom: 24px; }
    header h1 { font-size: 32px; font-weight: 700; margin-bottom: 6px; letter-spacing: -0.015em; }

    .search-wrapper { position: sticky; top: 15px; z-index: 10; margin-bottom: 16px; }
    .search-box {
      display: flex; align-items: center;
      background: var(--card-bg); backdrop-filter: blur(20px);
      border: 1px solid var(--card-border); border-radius: 16px;
      padding: 12px 18px; box-shadow: var(--shadow-soft);
    }
    .search-box i.search-icon { color: var(--text-secondary); font-size: 18px; margin-right: 12px; }
    .search-box input { border: none; background: transparent; outline: none; font-size: 16px; width: 100%; color: var(--text-main); }
    .clear-btn { color: var(--text-secondary); font-size: 16px; cursor: pointer; display: none; padding: 2px 6px; }

    /* 🏷️ 分類篩選容器 (支援自動換行) */
    .filter-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      box-shadow: var(--shadow-soft);
    }

    .filter-row-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    @media (min-width: 600px) {
      .filter-row-group {
        flex-direction: row;
        align-items: center;
        gap: 12px;
      }
    }

    .filter-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      width: 42px;
      flex-shrink: 0;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .filter-pills-scroll {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      flex: 1;
    }

    .pill {
      background: var(--pill-bg);
      border: 1px solid var(--pill-border);
      color: var(--pill-text);
      padding: 6px 12px;
      border-radius: 18px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
    }

    .pill.active {
      background: var(--pill-active-bg);
      color: var(--pill-active-text);
      border-color: var(--pill-active-bg);
    }

    .status-bar { margin-bottom: 16px; padding: 0 6px; font-size: 13px; color: var(--text-secondary); }

    .hymn-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    .hymn-card {
      background: var(--card-bg); backdrop-filter: blur(20px);
      border: 1px solid var(--card-border); border-radius: var(--radius-lg);
      padding: 20px; box-shadow: var(--shadow-soft); display: flex; flex-direction: column;
      justify-content: space-between; position: relative;
    }
    .card-header-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; padding-right: 28px; }
    .artist-tag { font-size: 11px; font-weight: 600; color: var(--accent-color); text-transform: uppercase; }
    
    .card-badges { display: flex; gap: 6px; align-items: center; }
    .lang-badge { display: inline-flex; background: rgba(52, 199, 89, 0.12); color: #34c759; font-size: 11px; font-weight: 600; padding: 3px 7px; border-radius: 6px; }
    .key-badge { display: inline-flex; background: rgba(0, 113, 227, 0.12); color: var(--accent-color); font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 6px; }

    .fav-btn {
      position: absolute; top: 18px; right: 18px; background: transparent; border: none; font-size: 18px; color: #b0b0b5; cursor: pointer;
    }
    .fav-btn.active { color: #ff3b30; }

    .hymn-title { font-size: 18px; font-weight: 600; margin-bottom: 10px; line-height: 1.35; }
    .stats-info {
      font-size: 12px; color: var(--text-secondary); background: var(--stats-bg);
      padding: 8px 10px; border-radius: 8px; margin-bottom: 14px; display: flex; justify-content: space-between;
    }

    .btn-group { display: flex; gap: 8px; }
    .action-btn { flex: 1; border: none; padding: 10px 8px; border-radius: var(--radius-md); font-size: 13px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .view-btn { background: var(--secondary-btn-bg); color: var(--text-main); }
    .download-btn { background: var(--accent-color); color: white; }

    /* ⬆️ 返回頂部浮動按鈕 */
    .scroll-top-btn {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 44px;
      height: 44px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 50%;
      color: var(--text-main);
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-modal);
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
      transition: all 0.3s ease;
      z-index: 99;
    }
    .scroll-top-btn.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }
    .scroll-top-btn:hover {
      background: var(--accent-color);
      color: white;
      border-color: var(--accent-color);
    }

    /* Modal Styling */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(10px);
      display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.25s ease; z-index: 100;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal { background: var(--modal-bg); border-radius: 20px; padding: 24px; width: 90%; max-width: 340px; text-align: center; box-shadow: var(--shadow-modal); border: 1px solid var(--card-border); }
    .password-input { width: 100%; padding: 12px; border: 1px solid var(--pill-border); border-radius: var(--radius-md); font-size: 16px; text-align: center; margin: 14px 0; outline: none; background: var(--secondary-btn-bg); color: var(--text-main); }
    .modal-buttons { display: flex; gap: 8px; }
    .modal-btn { flex: 1; padding: 10px; border-radius: var(--radius-md); font-size: 14px; border: none; cursor: pointer; }
    .btn-cancel { background: var(--secondary-btn-bg); color: var(--text-main); }
    .btn-confirm { background: var(--accent-color); color: white; }
    .error-msg { color: #ff3b30; font-size: 12px; display: none; margin-bottom: 10px; }

    /* PDF Viewer */
    .pdf-modal-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.88); backdrop-filter: blur(15px);
      display: flex; flex-direction: column; opacity: 0; pointer-events: none; transition: opacity 0.25s ease; z-index: 200;
    }
    .pdf-modal-overlay.active { opacity: 1; pointer-events: auto; }
    .pdf-toolbar { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background: rgba(255, 255, 255, 0.1); color: white; }
    .pdf-toolbar button { background: rgba(255, 255, 255, 0.2); border: none; color: white; padding: 6px 14px; border-radius: 8px; cursor: pointer; }
    .pdf-container { flex: 1; overflow: auto; display: flex; justify-content: center; align-items: flex-start; padding: 20px; }
    canvas { max-width: 100%; height: auto !important; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-radius: 8px; background: white; }

    .loading-state, .empty-state { text-align: center; padding: 60px 20px; grid-column: 1 / -1; color: var(--text-secondary); }
    .spinner { font-size: 24px; margin-bottom: 12px; animation: spin 1s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>詩歌檢索庫</h1>
    </header>

    <div class="search-wrapper">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" id="searchInput" placeholder="搜尋歌名、機構、Key、粵語或國語...">
        <i class="fa-solid fa-circle-xmark clear-btn" id="clearSearchBtn" onclick="clearSearch()"></i>
      </div>
    </div>

    <!-- 🏷️ 4行分類篩選容器 -->
    <div class="filter-container">
      <div class="filter-row-group">
        <span class="filter-label">語言</span>
        <div class="filter-pills-scroll" id="langPills"></div>
      </div>
      <div class="filter-row-group">
        <span class="filter-label">調性</span>
        <div class="filter-pills-scroll" id="keyPills"></div>
      </div>
      <div class="filter-row-group">
        <span class="filter-label">機構</span>
        <div class="filter-pills-scroll" id="artistPills"></div>
      </div>
      <div class="filter-row-group">
        <span class="filter-label">快速</span>
        <div class="filter-pills-scroll" id="actionPills"></div>
      </div>
    </div>

    <div class="status-bar">
      <span id="countText">正在同步 GitHub 與 Google 試算表...</span>
    </div>

    <div class="hymn-list" id="hymnList">
      <div class="loading-state">
        <i class="fa-solid fa-circle-notch spinner"></i>
        <p>載入中...</p>
      </div>
    </div>
  </div>

  <!-- ⬆️ 返回頂部浮動按鈕 -->
  <button class="scroll-top-btn" id="scrollTopBtn" onclick="scrollToTop()" title="返回頂部">
    <i class="fa-solid fa-arrow-up"></i>
  </button>

  <!-- Password Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h3 id="modalTitle" style="font-size:18px;">輸入密碼</h3>
      <p id="modalFileName" style="font-size:13px; color:var(--text-secondary); margin-top:4px;">樂譜檔名</p>
      <input type="password" id="passwordInput" class="password-input" placeholder="請輸入密碼">
      <div class="error-msg" id="errorMsg">密碼錯誤，請再試一次</div>
      <div class="modal-buttons">
        <button class="modal-btn btn-cancel" onclick="closeModal()">取消</button>
        <button class="modal-btn btn-confirm" id="modalConfirmBtn" onclick="verifyAndExecute()">確認</button>
      </div>
    </div>
  </div>

  <!-- PDF Preview Modal -->
  <div class="pdf-modal-overlay" id="pdfModalOverlay">
    <div class="pdf-toolbar">
      <span id="pdfTitleDisplay" style="font-size: 14px; font-weight: 600;">樂譜預覽</span>
      <div>
        <button onclick="changePage(-1)"><i class="fa-solid fa-chevron-left"></i></button>
        <span id="pageNumDisplay" style="margin: 0 8px; font-size:13px;">1 / 1</span>
        <button onclick="changePage(1)"><i class="fa-solid fa-chevron-right"></i></button>
        <button onclick="closePdfViewer()" style="margin-left: 12px; background: #ff3b30;">關閉</button>
      </div>
    </div>
    <div class="pdf-container">
      <canvas id="pdfCanvas"></canvas>
    </div>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // --------------------------------------------------
    // ⚙️ 設定區
    // --------------------------------------------------
    const CONFIG = {
      GITHUB_USERNAME: 'hkcccly',   
      GITHUB_REPO: 'hymn-library',             
      PDF_FOLDER: 'sheets',                     
      DOWNLOAD_PASSWORD: '26923386',             
      GOOGLE_SHEET_CSV_URL: 'https://docs.google.com/spreadsheets/d/1OmrNov8LfPHfW23VBFASrwtrwnM9IH355sJ3hBHelEo/export?format=csv'
    };

    let hymnsData = [];
    let favorites = JSON.parse(localStorage.getItem('hymn_favorites') || '[]');

    let selectedLangs = new Set();
    let selectedKeys = new Set();
    let selectedArtists = new Set();
    let onlyFavorites = false;

    let selectedPdfUrl = '';
    let selectedFileName = '';
    let currentAction = 'preview';
    let pdfDoc = null;
    let pageNum = 1;

    function normalizeTitle(str) {
      if (!str) return '';
      return str.toLowerCase()
                .replace(/[\s\u3000\-_.,()（）「」『』]/g, '')
                .trim();
    }

    // 🔠 調性格式化：首字大階，其餘細階（例如 AB -> Ab, bb -> Bb, C# -> C#）
    function formatKey(keyStr) {
      if (!keyStr || keyStr === 'N/A') return 'N/A';
      const trimmed = keyStr.trim();
      if (trimmed.length === 0) return 'N/A';
      return trimmed.charAt(0).toUpperCase() + trimmed.slice(1).toLowerCase();
    }

    // 📅 專業級穩健日期解析（支援 YYYY-MM-DD、YYYY/MM/DD、DD/MM/YYYY、Excel 序號等）
    function parseDateToTime(dateStr) {
      if (!dateStr) return 0;
      const cleanStr = dateStr.trim().replace(/['"]/g, '');
      if (!cleanStr || cleanStr === '崇拜日期' || cleanStr === '日期') return 0;
      
      if (/^\d{5}$/.test(cleanStr)) {
        const excelDate = parseInt(cleanStr, 10);
        const dateObj = new Date((excelDate - (25567 + 2)) * 86400 * 1000);
        return dateObj.getTime();
      }

      const parts = cleanStr.split(/[\/\-\.]/);
      if (parts.length === 3) {
        let n0 = parseInt(parts[0], 10);
        let n1 = parseInt(parts[1], 10);
        let n2 = parseInt(parts[2], 10);

        if (isNaN(n0) || isNaN(n1) || isNaN(n2)) return 0;

        let year, month, day;
        if (n0 > 31) {
          year = n0;
          month = n1 - 1;
          day = n2;
        } else if (n2 > 31) {
          day = n0;
          month = n1 - 1;
          year = n2;
        } else {
          day = n0;
          month = n1 - 1;
          year = n2 < 100 ? 2000 + n2 : n2;
        }
        const d = new Date(year, month, day);
        return isNaN(d.getTime()) ? 0 : d.getTime();
      }

      const t = new Date(cleanStr).getTime();
      return isNaN(t) ? 0 : t;
    }

    // 📊 強固的 CSV 解析器（正確處理引號與逗號）
    function parseCSV(text) {
      const lines = text.split(/\r\n|\n/);
      const result = [];
      for (let line of lines) {
        if (!line.trim()) continue;
        const row = [];
        let inQuotes = false;
        let entry = '';
        for (let i = 0; i < line.length; i++) {
          let char = line[i];
          if (char === '"') {
            inQuotes = !inQuotes;
          } else if (char === ',' && !inQuotes) {
            row.push(entry.trim().replace(/^["']|["']$/g, ''));
            entry = '';
          } else {
            entry += char;
          }
        }
        row.push(entry.trim().replace(/^["']|["']$/g, ''));
        result.push(row);
      }
      return result;
    }

    async function initApp() {
      try {
        const sheetStats = await fetchGoogleSheetStats(CONFIG.GOOGLE_SHEET_CSV_URL);
        const githubFiles = await fetchGitHubFilesRecursive(CONFIG.PDF_FOLDER);

        hymnsData = githubFiles.map(file => {
          const rawName = file.name.replace('.pdf', '');
          const parts = rawName.split('_');
          
          const artist = parts[0] || '未知機構';
          const title = parts[1] || rawName;
          const rawKey = parts[2] ? parts[2] : 'N/A';
          const key = formatKey(rawKey);
          const language = file.langFolder || '未分類';
          
          const cleanTitleKey = normalizeTitle(title);
          const stat = sheetStats[cleanTitleKey] || { count: 0, lastDate: '未曾記錄' };

          return {
            id: file.path,
            artist: artist,
            title: title,
            key: key,
            language: language,
            downloadUrl: file.download_url,
            fileName: file.name,
            singCount: stat.count,
            lastSung: stat.lastDate
          };
        });

        generateFilterPills();
        renderHymns();

      } catch (error) {
        console.error("初始化錯誤:", error);
        document.getElementById('hymnList').innerHTML = `
          <div class="empty-state">
            <i class="fa-solid fa-triangle-exclamation" style="font-size:32px; margin-bottom:12px;"></i>
            <p>資料載入失敗，請確認 GitHub 設定與 Google 試算表已公開。</p>
          </div>
        `;
        document.getElementById('countText').innerText = '載入失敗';
      }
    }

    async function fetchGoogleSheetStats(csvUrl) {
      if (!csvUrl) return {};
      try {
        const response = await fetch(csvUrl);
        const text = await response.text();
        const rows = parseCSV(text);
        const stats = {};

        for (let i = 1; i < rows.length; i++) {
          const cols = rows[i];
          if (cols.length >= 2) {
            const date = cols[0] ? cols[0].trim().replace(/['"]/g, '') : '';
            if (!date || date === '崇拜日期' || date === '日期') continue;
            
            const currentTime = parseDateToTime(date);

            for (let j = 2; j < cols.length; j++) {
              const rawTitle = cols[j] ? cols[j].trim().replace(/['"]/g, '') : '';
              if (!rawTitle) continue;

              const titleKey = normalizeTitle(rawTitle);

              if (!stats[titleKey]) {
                stats[titleKey] = { count: 0, lastDate: date, timeVal: currentTime };
              }
              stats[titleKey].count++;
              
              if (currentTime >= stats[titleKey].timeVal) {
                stats[titleKey].timeVal = currentTime;
                stats[titleKey].lastDate = date;
              }
            }
          }
        }
        return stats;
      } catch (e) {
        console.warn('無法讀取試算表', e);
        return {};
      }
    }

    async function fetchGitHubFilesRecursive(folderPath) {
      const apiUrl = `https://api.github.com/repos/${CONFIG.GITHUB_USERNAME}/${CONFIG.GITHUB_REPO}/contents/${folderPath}`;
      const response = await fetch(apiUrl);
      if (!response.ok) throw new Error('無法存取 GitHub API');
      const items = await response.json();
      
      let allFiles = [];

      for (const item of items) {
        if (item.type === 'dir') {
          const subFilesResponse = await fetch(item.url);
          if (subFilesResponse.ok) {
            const subItems = await subFilesResponse.json();
            const pdfs = subItems
              .filter(f => f.name.toLowerCase().endsWith('.pdf'))
              .map(f => ({ ...f, langFolder: item.name }));
            allFiles = allFiles.concat(pdfs);
          }
        } else if (item.type === 'file' && item.name.toLowerCase().endsWith('.pdf')) {
          allFiles.push({ ...item, langFolder: '未分類' });
        }
      }

      return allFiles;
    }

    function generateFilterPills() {
      // 💡 修正語言排序：強制讓「粵語」排在最前面，其餘（如國語等）按字母排序
      const languages = [...new Set(hymnsData.map(h => h.language))].sort((a, b) => {
        if (a === '粵語') return -1;
        if (b === '粵語') return 1;
        return a.localeCompare(b);
      });

      const keys = [...new Set(hymnsData.map(h => h.key).filter(k => k !== 'N/A'))].sort();
      const artists = [...new Set(hymnsData.map(h => h.artist).filter(a => a !== '未知機構'))].sort();

      const allActive = selectedLangs.size === 0 && selectedKeys.size === 0 && selectedArtists.size === 0 && !onlyFavorites;
      document.getElementById('actionPills').innerHTML = `
        <button class="pill ${allActive ? 'active' : ''}" onclick="toggleFilter('ALL')"><i class="fa-solid fa-border-all"></i> 全部</button>
        <button class="pill ${onlyFavorites ? 'active' : ''}" onclick="toggleFilter('FAV')"><i class="fa-solid fa-heart" style="color:#ff3b30;"></i> 已收藏</button>
      `;

      let langHtml = '';
      languages.forEach(l => {
        const isActive = selectedLangs.has(l);
        langHtml += `<button class="pill ${isActive ? 'active' : ''}" onclick="toggleFilter('LANG', '${escapeHtml(l)}')">${escapeHtml(l)}</button>`;
      });
      document.getElementById('langPills').innerHTML = langHtml;

      let keyHtml = '';
      keys.forEach(k => {
        const isActive = selectedKeys.has(k);
        keyHtml += `<button class="pill ${isActive ? 'active' : ''}" onclick="toggleFilter('KEY', '${k}')">Key: ${k}</button>`;
      });
      document.getElementById('keyPills').innerHTML = keyHtml;

      let artistHtml = '';
      artists.forEach(a => {
        const isActive = selectedArtists.has(a);
        artistHtml += `<button class="pill ${isActive ? 'active' : ''}" onclick="toggleFilter('ARTIST', '${escapeHtml(a)}')">${escapeHtml(a)}</button>`;
      });
      document.getElementById('artistPills').innerHTML = artistHtml;
    }

    function toggleFilter(type, value) {
      if (type === 'ALL') {
        selectedLangs.clear();
        selectedKeys.clear();
        selectedArtists.clear();
        onlyFavorites = false;
      } else if (type === 'FAV') {
        onlyFavorites = !onlyFavorites;
      } else if (type === 'LANG') {
        if (selectedLangs.has(value)) selectedLangs.delete(value);
        else selectedLangs.add(value);
      } else if (type === 'KEY') {
        if (selectedKeys.has(value)) selectedKeys.delete(value);
        else selectedKeys.add(value);
      } else if (type === 'ARTIST') {
        if (selectedArtists.has(value)) selectedArtists.delete(value);
        else selectedArtists.add(value);
      }
      generateFilterPills();
      renderHymns();
    }

    function renderHymns() {
      const container = document.getElementById('hymnList');
      const query = document.getElementById('searchInput').value.toLowerCase().trim();

      document.getElementById('clearSearchBtn').style.display = query ? 'block' : 'none';

      let filtered = hymnsData.filter(item => {
        const matchesQuery = 
          item.title.toLowerCase().includes(query) ||
          item.artist.toLowerCase().includes(query) ||
          item.key.toLowerCase().includes(query) ||
          item.language.toLowerCase().includes(query);

        const matchesLang = selectedLangs.size === 0 || selectedLangs.has(item.language);
        const matchesKey = selectedKeys.size === 0 || selectedKeys.has(item.key);
        const matchesArtist = selectedArtists.size === 0 || selectedArtists.has(item.artist);
        const matchesFav = !onlyFavorites || favorites.includes(item.id);

        return matchesQuery && matchesLang && matchesKey && matchesArtist && matchesFav;
      });

      document.getElementById('countText').innerText = `共找到 ${filtered.length} 首詩歌譜`;

      if (filtered.length === 0) {
        container.innerHTML = `<div class="empty-state"><p>沒有找到符合條件的詩歌譜</p></div>`;
        return;
      }

      container.innerHTML = filtered.map(item => {
        const isFav = favorites.includes(item.id);
        return `
          <div class="hymn-card">
            <button class="fav-btn ${isFav ? 'active' : ''}" onclick="toggleFav('${escapeHtml(item.id)}', this)">
              <i class="${isFav ? 'fa-solid' : 'fa-regular'} fa-heart"></i>
            </button>
            <div>
              <div class="card-header-row">
                <span class="artist-tag">${escapeHtml(item.artist)}</span>
                <div class="card-badges">
                  ${item.language !== '未分類' ? `<span class="lang-badge">${escapeHtml(item.language)}</span>` : ''}
                  <span class="key-badge">Key: ${escapeHtml(item.key)}</span>
                </div>
              </div>
              <div class="hymn-title">${escapeHtml(item.title)}</div>
              
              <div class="stats-info">
                <span><i class="fa-solid fa-rotate-right" style="color:var(--accent-color);"></i> 唱過: <b>${item.singCount}</b> 次</span>
                <span><i class="fa-regular fa-calendar"></i> 上次: <b>${escapeHtml(item.lastSung)}</b></span>
              </div>
            </div>

            <div class="btn-group">
              <button class="action-btn view-btn" onclick="openModal('preview', '${item.downloadUrl}', '${escapeHtml(item.title)}', '${item.fileName}')">
                <i class="fa-regular fa-eye"></i> 檢視
              </button>
              <button class="action-btn download-btn" onclick="openModal('download', '${item.downloadUrl}', '${escapeHtml(item.title)}', '${item.fileName}')">
                <i class="fa-solid fa-arrow-down-to-line"></i> 下載
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function toggleFav(id, btn) {
      if (favorites.includes(id)) {
        favorites = favorites.filter(favId => favId !== id);
      } else {
        favorites.push(id);
      }
      localStorage.setItem('hymn_favorites', JSON.stringify(favorites));
      
      const icon = btn.querySelector('i');
      const isFav = favorites.includes(id);
      btn.classList.toggle('active', isFav);
      icon.className = `${isFav ? 'fa-solid' : 'fa-regular'} fa-heart`;

      if (onlyFavorites) {
        renderHymns();
      }
    }

    window.addEventListener('scroll', () => {
      const btn = document.getElementById('scrollTopBtn');
      if (window.scrollY > 300) {
        btn.classList.add('show');
      } else {
        btn.classList.remove('show');
      }
    });

    function scrollToTop() {
      window.scrollTo({
        top: 0,
        behavior: 'smooth'
      });
    }

    document.getElementById('searchInput').addEventListener('input', renderHymns);

    function clearSearch() {
      document.getElementById('searchInput').value = '';
      renderHymns();
      document.getElementById('searchInput').focus();
    }

    function openModal(action, url, title, fileName) {
      currentAction = action;
      selectedPdfUrl = url;
      selectedFileName = fileName || `${title}.pdf`;
      
      document.getElementById('modalTitle').innerText = action === 'preview' ? '輸入密碼以線上檢視' : '輸入密碼以下載檔案';
      document.getElementById('modalConfirmBtn').innerText = action === 'preview' ? '開啟檢視' : '確認下載';
      document.getElementById('modalFileName').innerText = title;
      document.getElementById('passwordInput').value = '';
      document.getElementById('errorMsg').style.display = 'none';
      document.getElementById('modalOverlay').classList.add('active');
      document.getElementById('passwordInput').focus();
    }

    function closeModal() { document.getElementById('modalOverlay').classList.remove('active'); }

    async function verifyAndExecute() {
      const pwd = document.getElementById('passwordInput').value;
      if (pwd === CONFIG.DOWNLOAD_PASSWORD) {
        closeModal();
        if (currentAction === 'preview') {
          loadPdfInViewer(selectedPdfUrl, selectedFileName);
        } else {
          try {
            const response = await fetch(selectedPdfUrl);
            const blob = await response.blob();
            const blobUrl = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = blobUrl; a.download = selectedFileName;
            document.body.appendChild(a); a.click();
            document.body.removeChild(a); URL.revokeObjectURL(blobUrl);
          } catch (err) {
            window.open(selectedPdfUrl, '_blank');
          }
        }
      } else {
        document.getElementById('errorMsg').style.display = 'block';
      }
    }

    async function loadPdfInViewer(url, title) {
      document.getElementById('pdfTitleDisplay').innerText = title;
      document.getElementById('pdfModalOverlay').classList.add('active');
      try {
        pdfDoc = await pdfjsLib.getDocument(url).promise;
        pageNum = 1;
        renderPdfPage(pageNum);
      } catch (error) {
        alert('樂譜載入失敗');
        closePdfViewer();
      }
    }

    async function renderPdfPage(num) {
      const page = await pdfDoc.getPage(num);
      const canvas = document.getElementById('pdfCanvas');
      const ctx = canvas.getContext('2d');
      const viewport = page.getViewport({ scale: 1.5 });
      canvas.height = viewport.height;
      canvas.width = viewport.width;
      await page.render({ canvasContext: ctx, viewport: viewport }).promise;
      document.getElementById('pageNumDisplay').innerText = `${num} / ${pdfDoc.numPages}`;
    }

    function changePage(delta) {
      if (!pdfDoc) return;
      if (pageNum + delta >= 1 && pageNum + delta <= pdfDoc.numPages) {
        pageNum += delta;
        renderPdfPage(pageNum);
      }
    }

    function closePdfViewer() { document.getElementById('pdfModalOverlay').classList.remove('active'); }

    document.getElementById('passwordInput').addEventListener('keyup', (e) => {
      if (e.key === 'Enter') verifyAndExecute();
    });

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }

    initApp();
  </script>
</body>
</html>
