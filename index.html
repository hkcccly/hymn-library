<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>詩歌檢索庫 | Hymn Library</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- 載入 Mozilla PDF.js 用於跨平台穩定預覽 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    /* Apple SF Pro Aesthetic Global Styling */
    :root {
      --bg-color: #f5f5f7;
      --card-bg: rgba(255, 255, 255, 0.75);
      --card-border: rgba(255, 255, 255, 0.8);
      --accent-color: #0071e3;
      --accent-hover: #0077ed;
      --secondary-btn-bg: #e8e8ed;
      --secondary-btn-hover: #dcdce0;
      --text-main: #1d1d1f;
      --text-secondary: #86868b;
      --shadow-soft: 0 8px 30px rgba(0, 0, 0, 0.04);
      --shadow-modal: 0 20px 40px rgba(0, 0, 0, 0.15);
      --radius-lg: 20px;
      --radius-md: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 30px 16px 80px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 860px;
    }

    /* Header Styling */
    header {
      text-align: center;
      margin-bottom: 28px;
    }

    header h1 {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #1d1d1f 0%, #434344 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      color: var(--text-secondary);
      font-size: 15px;
    }

    /* Search Bar Styling */
    .search-wrapper {
      position: sticky;
      top: 15px;
      z-index: 10;
      margin-bottom: 24px;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 12px 18px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.04);
    }

    .search-box i {
      color: var(--text-secondary);
      font-size: 18px;
      margin-right: 12px;
    }

    .search-box input {
      border: none;
      background: transparent;
      outline: none;
      font-size: 16px;
      width: 100%;
      color: var(--text-main);
    }

    /* Status Bar */
    .status-bar {
      margin-bottom: 16px;
      padding: 0 6px;
      font-size: 13px;
      color: var(--text-secondary);
    }

    /* Hymn Cards Grid */
    .hymn-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 16px;
    }

    .hymn-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: var(--shadow-soft);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .artist-tag {
      font-size: 11px;
      font-weight: 600;
      color: var(--accent-color);
      text-transform: uppercase;
      margin-bottom: 4px;
      display: block;
    }

    .hymn-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .key-badge {
      display: inline-flex;
      background: rgba(0, 113, 227, 0.08);
      color: var(--accent-color);
      font-size: 12px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 6px;
      margin-bottom: 14px;
    }

    .btn-group {
      display: flex;
      gap: 8px;
    }

    .action-btn {
      flex: 1;
      border: none;
      padding: 10px 8px;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .view-btn {
      background: var(--secondary-btn-bg);
      color: var(--text-main);
    }

    .download-btn {
      background: var(--accent-color);
      color: white;
    }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 100;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 24px;
      width: 90%;
      max-width: 340px;
      text-align: center;
      box-shadow: var(--shadow-modal);
    }

    .password-input {
      width: 100%;
      padding: 12px;
      border: 1px solid #d2d2d7;
      border-radius: var(--radius-md);
      font-size: 16px;
      text-align: center;
      margin: 14px 0;
      outline: none;
    }

    .modal-buttons {
      display: flex;
      gap: 8px;
    }

    .modal-btn {
      flex: 1;
      padding: 10px;
      border-radius: var(--radius-md);
      font-size: 14px;
      border: none;
      cursor: pointer;
    }

    .btn-cancel { background: #e5e5ea; color: var(--text-main); }
    .btn-confirm { background: var(--accent-color); color: white; }
    .error-msg { color: #ff3b30; font-size: 12px; display: none; margin-bottom: 10px; }

    /* PDF Viewer Modal (Apple/Android 跨平台預覽專用) */
    .pdf-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 200;
    }

    .pdf-modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .pdf-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background: rgba(255, 255, 255, 0.1);
      color: white;
    }

    .pdf-toolbar button {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: white;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    .pdf-container {
      flex: 1;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px;
      -webkit-overflow-scrolling: touch;
    }

    canvas {
      max-width: 100%;
      height: auto !important;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border-radius: 8px;
      background: white;
    }

    .loading-state, .empty-state {
      text-align: center;
      padding: 60px 20px;
      grid-column: 1 / -1;
      color: var(--text-secondary);
    }

    .spinner {
      font-size: 24px;
      margin-bottom: 12px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>詩歌檢索庫</h1>
      
    </header>

    <div class="search-wrapper">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="搜尋歌名、音樂機構、Key...">
      </div>
    </div>

    <div class="status-bar">
      <span id="countText">正在讀取歌譜...</span>
    </div>

    <div class="hymn-list" id="hymnList">
      <div class="loading-state">
        <i class="fa-solid fa-circle-notch spinner"></i>
        <p>載入詩歌庫中...</p>
      </div>
    </div>
  </div>

  <!-- Password Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h3 id="modalTitle" style="font-size:18px;">輸入密碼</h3>
      <p id="modalFileName" style="font-size:13px; color:var(--text-secondary); margin-top:4px;">樂譜檔名</p>
      <input type="password" id="passwordInput" class="password-input" placeholder="請輸入密碼">
      <div class="error-msg" id="errorMsg">密碼錯誤，請再試一次</div>
      <div class="modal-buttons">
        <button class="modal-btn btn-cancel" onclick="closeModal()">取消</button>
        <button class="modal-btn btn-confirm" id="modalConfirmBtn" onclick="verifyAndExecute()">確認</button>
      </div>
    </div>
  </div>

  <!-- PDF Preview Modal (跨平台網頁內嵌閱讀器) -->
  <div class="pdf-modal-overlay" id="pdfModalOverlay">
    <div class="pdf-toolbar">
      <span id="pdfTitleDisplay" style="font-size: 14px; font-weight: 600;">樂譜預覽</span>
      <div>
        <button onclick="changePage(-1)"><i class="fa-solid fa-chevron-left"></i></button>
        <span id="pageNumDisplay" style="margin: 0 8px; font-size:13px;">1 / 1</span>
        <button onclick="changePage(1)"><i class="fa-solid fa-chevron-right"></i></button>
        <button onclick="closePdfViewer()" style="margin-left: 12px; background: #ff3b30;">關閉</button>
      </div>
    </div>
    <div class="pdf-container">
      <canvas id="pdfCanvas"></canvas>
    </div>
  </div>

  <script>
    // PDF.js 設定
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // --------------------------------------------------
    // ⚙️ 設定區（請修改為你的 GitHub 資訊）
    // --------------------------------------------------
    const CONFIG = {
      GITHUB_USERNAME: 'hkcccly', // 改為你的 GitHub 帳號
      GITHUB_REPO: 'hymn-library',           // 改為你的 Repository 名稱
      PDF_FOLDER: 'sheets',                   // 放置 PDF 的資料夾名稱
      DOWNLOAD_PASSWORD: '26923386'           // 解鎖密碼
    };

    let hymnsData = [];
    let selectedPdfUrl = '';
    let selectedFileName = '';
    let currentAction = 'preview';

    // PDF 渲染變數
    let pdfDoc = null;
    let pageNum = 1;

    async function fetchHymnsFromGitHub() {
      const apiUrl = `https://api.github.com/repos/${CONFIG.GITHUB_USERNAME}/${CONFIG.GITHUB_REPO}/contents/${CONFIG.PDF_FOLDER}`;
      
      try {
        const response = await fetch(apiUrl);
        if (!response.ok) throw new Error('無法存取 GitHub 樂譜資料夾');
        
        const files = await response.json();
        const pdfFiles = files.filter(file => file.name.endsWith('.pdf'));

        hymnsData = pdfFiles.map((file, index) => {
          const rawName = file.name.replace('.pdf', '');
          const parts = rawName.split('_');

          return {
            id: index + 1,
            artist: parts[0] || '未知機構',
            title: parts[1] || rawName,
            key: parts[2] ? parts[2].toUpperCase() : 'N/A',
            downloadUrl: file.download_url,
            fileName: file.name
          };
        });

        renderHymns(hymnsData);

      } catch (error) {
        console.error(error);
        document.getElementById('hymnList').innerHTML = `
          <div class="empty-state">
            <i class="fa-solid fa-triangle-exclamation" style="font-size:32px; margin-bottom:12px;"></i>
            <p>尚未讀取到詩歌譜。請確認 CONFIG 內的 GitHub 帳號與專案名稱正確，且含有 sheets/ 資料夾。</p>
          </div>
        `;
        document.getElementById('countText').innerText = '讀取失敗';
      }
    }

    function renderHymns(list) {
      const container = document.getElementById('hymnList');
      document.getElementById('countText').innerText = `共找到 ${list.length} 首詩歌譜`;

      if (list.length === 0) {
        container.innerHTML = `<div class="empty-state"><p>沒有找到符合關鍵字的詩歌譜</p></div>`;
        return;
      }

      container.innerHTML = list.map(item => `
        <div class="hymn-card">
          <div>
            <span class="artist-tag">${escapeHtml(item.artist)}</span>
            <div class="hymn-title">${escapeHtml(item.title)}</div>
            <span class="key-badge">Key: ${escapeHtml(item.key)}</span>
          </div>
          <div class="btn-group">
            <button class="action-btn view-btn" onclick="openModal('preview', '${item.downloadUrl}', '${escapeHtml(item.title)}', '${item.fileName}')">
              <i class="fa-regular fa-eye"></i> 檢視
            </button>
            <button class="action-btn download-btn" onclick="openModal('download', '${item.downloadUrl}', '${escapeHtml(item.title)}', '${item.fileName}')">
              <i class="fa-solid fa-arrow-down-to-line"></i> 下載
            </button>
          </div>
        </div>
      `).join('');
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase().trim();
      const filtered = hymnsData.filter(item => 
        item.title.toLowerCase().includes(query) ||
        item.artist.toLowerCase().includes(query) ||
        item.key.toLowerCase().includes(query)
      );
      renderHymns(filtered);
    });

    function openModal(action, url, title, fileName) {
      currentAction = action;
      selectedPdfUrl = url;
      selectedFileName = fileName || `${title}.pdf`;
      
      document.getElementById('modalTitle').innerText = action === 'preview' ? '輸入密碼以線上檢視' : '輸入密碼以下載檔案';
      document.getElementById('modalConfirmBtn').innerText = action === 'preview' ? '開啟檢視' : '確認下載';
      document.getElementById('modalFileName').innerText = title;
      document.getElementById('passwordInput').value = '';
      document.getElementById('errorMsg').style.display = 'none';
      document.getElementById('modalOverlay').classList.add('active');
      document.getElementById('passwordInput').focus();
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
    }

    async function verifyAndExecute() {
      const pwd = document.getElementById('passwordInput').value;
      if (pwd === CONFIG.DOWNLOAD_PASSWORD) {
        closeModal();
        if (currentAction === 'preview') {
          // 呼叫跨平台 PDF.js 樂譜檢視器，絕不觸發下載
          loadPdfInViewer(selectedPdfUrl, selectedFileName);
        } else {
          // 下載檔案邏輯
          try {
            const response = await fetch(selectedPdfUrl);
            const blob = await response.blob();
            const blobUrl = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = blobUrl;
            a.download = selectedFileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(blobUrl);
          } catch (err) {
            window.open(selectedPdfUrl, '_blank');
          }
        }
      } else {
        document.getElementById('errorMsg').style.display = 'block';
      }
    }

    // --------------------------------------------------
    // PDF 跨平台檢視器邏輯 (PDF.js)
    // --------------------------------------------------
    async function loadPdfInViewer(url, title) {
      document.getElementById('pdfTitleDisplay').innerText = title;
      document.getElementById('pdfModalOverlay').classList.add('active');

      try {
        pdfDoc = await pdfjsLib.getDocument(url).promise;
        pageNum = 1;
        renderPdfPage(pageNum);
      } catch (error) {
        alert('樂譜載入失敗，請稍後再試');
        closePdfViewer();
      }
    }

    async function renderPdfPage(num) {
      const page = await pdfDoc.getPage(num);
      const canvas = document.getElementById('pdfCanvas');
      const ctx = canvas.getContext('2d');

      // 依裝置螢幕寬度自動調整樂譜比例 (支援手機)
      const viewport = page.getViewport({ scale: 1.5 });
      canvas.height = viewport.height;
      canvas.width = viewport.width;

      await page.render({ canvasContext: ctx, viewport: viewport }).promise;
      document.getElementById('pageNumDisplay').innerText = `${num} / ${pdfDoc.numPages}`;
    }

    function changePage(delta) {
      if (!pdfDoc) return;
      if (pageNum + delta >= 1 && pageNum + delta <= pdfDoc.numPages) {
        pageNum += delta;
        renderPdfPage(pageNum);
      }
    }

    function closePdfViewer() {
      document.getElementById('pdfModalOverlay').classList.remove('active');
    }

    document.getElementById('passwordInput').addEventListener('keyup', (e) => {
      if (e.key === 'Enter') verifyAndExecute();
    });

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }

    fetchHymnsFromGitHub();
  </script>
</body>
</html>
