<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>詩歌檢索庫 | Hymn Library</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Apple SF Pro Aesthetic Global Styling */
    :root {
      --bg-color: #f5f5f7;
      --card-bg: rgba(255, 255, 255, 0.75);
      --card-border: rgba(255, 255, 255, 0.8);
      --accent-color: #0071e3;
      --accent-hover: #0077ed;
      --text-main: #1d1d1f;
      --text-secondary: #86868b;
      --shadow-soft: 0 8px 30px rgba(0, 0, 0, 0.04);
      --shadow-modal: 0 20px 40px rgba(0, 0, 0, 0.15);
      --radius-lg: 20px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 40px 20px 80px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 860px;
    }

    /* Header Styling */
    header {
      text-align: center;
      margin-bottom: 36px;
    }

    header h1 {
      font-size: 38px;
      font-weight: 700;
      letter-spacing: -0.015em;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #1d1d1f 0%, #434344 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      color: var(--text-secondary);
      font-size: 16px;
      font-weight: 400;
    }

    /* Search Bar Bar Styling */
    .search-wrapper {
      position: sticky;
      top: 20px;
      z-index: 10;
      margin-bottom: 30px;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 12px 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      transition: all 0.25s ease;
    }

    .search-box:focus-within {
      box-shadow: 0 12px 30px rgba(0, 113, 227, 0.15);
      border-color: rgba(0, 113, 227, 0.4);
      background: #ffffff;
    }

    .search-box i {
      color: var(--text-secondary);
      font-size: 18px;
      margin-right: 14px;
    }

    .search-box input {
      border: none;
      background: transparent;
      outline: none;
      font-size: 17px;
      width: 100%;
      color: var(--text-main);
    }

    .search-box input::placeholder {
      color: #a1a1a6;
    }

    /* Filter & Status Bar */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding: 0 8px;
      font-size: 14px;
      color: var(--text-secondary);
    }

    /* Hymn Cards Grid */
    .hymn-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .hymn-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 22px;
      box-shadow: var(--shadow-soft);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .hymn-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 35px rgba(0, 0, 0, 0.08);
    }

    .card-top {
      margin-bottom: 16px;
    }

    .artist-tag {
      font-size: 12px;
      font-weight: 600;
      color: var(--accent-color);
      letter-spacing: 0.03em;
      text-transform: uppercase;
      margin-bottom: 6px;
      display: block;
    }

    .hymn-title {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.3;
      margin-bottom: 12px;
    }

    .key-badge {
      display: inline-flex;
      align-items: center;
      background: rgba(0, 113, 227, 0.08);
      color: var(--accent-color);
      font-size: 13px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
    }

    .download-btn {
      width: 100%;
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s ease;
    }

    .download-btn:hover {
      background: var(--accent-hover);
    }

    /* Modal Dialog */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 100;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-radius: 20px;
      padding: 28px;
      width: 90%;
      max-width: 360px;
      box-shadow: var(--shadow-modal);
      text-align: center;
      transform: scale(0.95);
      transition: transform 0.25s ease;
    }

    .modal-overlay.active .modal {
      transform: scale(1);
    }

    .modal h3 {
      font-size: 19px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .modal p {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 20px;
    }

    .password-input {
      width: 100%;
      padding: 12px;
      border: 1px solid #d2d2d7;
      border-radius: var(--radius-md);
      font-size: 16px;
      text-align: center;
      margin-bottom: 16px;
      outline: none;
    }

    .password-input:focus {
      border-color: var(--accent-color);
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
    }

    .modal-btn {
      flex: 1;
      padding: 10px;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: none;
    }

    .btn-cancel {
      background: #e5e5ea;
      color: var(--text-main);
    }

    .btn-confirm {
      background: var(--accent-color);
      color: white;
    }

    .error-msg {
      color: #ff3b30;
      font-size: 12px;
      margin-top: -10px;
      margin-bottom: 12px;
      display: none;
    }

    /* Loading state */
    .loading-state, .empty-state {
      text-align: center;
      padding: 60px 20px;
      grid-column: 1 / -1;
      color: var(--text-secondary);
    }

    .spinner {
      font-size: 24px;
      margin-bottom: 12px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>詩歌檢索庫</h1>
    
    </header>

    <div class="search-wrapper">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="搜尋歌名、音樂機構、Key (如: 讚美之泉 / G)...">
      </div>
    </div>

    <div class="status-bar">
      <span id="countText">正在連接 GitHub 自動讀取歌譜...</span>
    </div>

    <div class="hymn-list" id="hymnList">
      <div class="loading-state">
        <i class="fa-solid fa-circle-notch spinner"></i>
        <p>載入詩歌庫中...</p>
      </div>
    </div>
  </div>

  <!-- Password Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h3>輸入密碼下載</h3>
      <p id="modalFileName">樂譜檔名</p>
      <input type="password" id="passwordInput" class="password-input" placeholder="請輸入下載密碼">
      <div class="error-msg" id="errorMsg">密碼錯誤，請再試一次</div>
      <div class="modal-buttons">
        <button class="modal-btn btn-cancel" onclick="closeModal()">取消</button>
        <button class="modal-btn btn-confirm" onclick="verifyAndDownload()">下載</button>
      </div>
    </div>
  </div>

  <script>
    // --------------------------------------------------
    // ⚙️ 設定區（請修改為你的 GitHub 資訊）
    // --------------------------------------------------
    const CONFIG = {
      GITHUB_USERNAME: 'hkcccly', // 改為你的 GitHub 帳號
      GITHUB_REPO: 'hymn-library',           // 改為你的 Repository 名稱
      PDF_FOLDER: 'sheets',                   // 放置 PDF 的資料夾名稱
      DOWNLOAD_PASSWORD: '26923386'           // 解鎖下載密碼
    };

    let hymnsData = [];
    let selectedPdfUrl = '';
    let selectedFileName = '';

    // --------------------------------------------------
    // 1. 從 GitHub API 自動讀取 sheets/ 資料夾中的 PDF
    // --------------------------------------------------
    async function fetchHymnsFromGitHub() {
      const apiUrl = `https://api.github.com/repos/${CONFIG.GITHUB_USERNAME}/${CONFIG.GITHUB_REPO}/contents/${CONFIG.PDF_FOLDER}`;
      
      try {
        const response = await fetch(apiUrl);
        if (!response.ok) throw new Error('無法存取 GitHub 樂譜資料夾');
        
        const files = await response.json();
        
        // 過濾只取 .pdf 檔案
        const pdfFiles = files.filter(file => file.name.endsWith('.pdf'));

        // 解析檔名格式：機構_歌名_Key.pdf
        hymnsData = pdfFiles.map((file, index) => {
          const rawName = file.name.replace('.pdf', '');
          const parts = rawName.split('_');

          return {
            id: index + 1,
            artist: parts[0] || '未知機構',
            title: parts[1] || rawName,
            key: parts[2] ? parts[2].toUpperCase() : 'N/A',
            downloadUrl: file.download_url,
            fileName: file.name
          };
        });

        renderHymns(hymnsData);

      } catch (error) {
        console.error(error);
        document.getElementById('hymnList').innerHTML = `
          <div class="empty-state">
            <i class="fa-solid fa-triangle-exclamation" style="font-size:32px; margin-bottom:12px;"></i>
            <p>尚未讀取到詩歌譜。請確認 CONFIG 內的 GitHub 帳號與專案名稱正確，且含有 sheets/ 資料夾。</p>
          </div>
        `;
        document.getElementById('countText').innerText = '讀取失敗';
      }
    }

    // --------------------------------------------------
    // 2. 渲染詩歌卡片列表
    // --------------------------------------------------
    function renderHymns(list) {
      const container = document.getElementById('hymnList');
      const countText = document.getElementById('countText');

      countText.innerText = `共找到 ${list.length} 首詩歌譜`;

      if (list.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <p>沒有找到符合關鍵字的詩歌譜</p>
          </div>
        `;
        return;
      }

      container.innerHTML = list.map(item => `
        <div class="hymn-card">
          <div class="card-top">
            <span class="artist-tag">${escapeHtml(item.artist)}</span>
            <div class="hymn-title">${escapeHtml(item.title)}</div>
            <span class="key-badge">Key: ${escapeHtml(item.key)}</span>
          </div>
          <button class="download-btn" onclick="openModal('${item.downloadUrl}', '${escapeHtml(item.title)}')">
            <i class="fa-solid fa-arrow-down-to-line"></i> 下載 PDF
          </button>
        </div>
      `).join('');
    }

    // --------------------------------------------------
    // 3. 搜尋過濾（支援歌名、機構、Key）
    // --------------------------------------------------
    document.getElementById('searchInput').addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase().trim();
      const filtered = hymnsData.filter(item => 
        item.title.toLowerCase().includes(query) ||
        item.artist.toLowerCase().includes(query) ||
        item.key.toLowerCase().includes(query)
      );
      renderHymns(filtered);
    });

    // --------------------------------------------------
    // 4. 密碼驗證與下載彈窗 logic
    // --------------------------------------------------
    function openModal(url, title) {
      selectedPdfUrl = url;
      selectedFileName = title;
      document.getElementById('modalFileName').innerText = title;
      document.getElementById('passwordInput').value = '';
      document.getElementById('errorMsg').style.display = 'none';
      document.getElementById('modalOverlay').classList.add('active');
      document.getElementById('passwordInput').focus();
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
    }

    function verifyAndDownload() {
      const pwd = document.getElementById('passwordInput').value;
      if (pwd === CONFIG.DOWNLOAD_PASSWORD) {
        // 密碼正確，開啟 PDF 檔案
        window.open(selectedPdfUrl, '_blank');
        closeModal();
      } else {
        document.getElementById('errorMsg').style.display = 'block';
      }
    }

    // 按 Enter 鍵支援觸發下載
    document.getElementById('passwordInput').addEventListener('keyup', (e) => {
      if (e.key === 'Enter') verifyAndDownload();
    });

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }

    // 頁面載入時自動執行
    fetchHymnsFromGitHub();
  </script>
</body>
</html>
